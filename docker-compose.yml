version: '3.8'

services:
  control-plane:
    build:
      context: .
      dockerfile: Dockerfile.control-plane
    container_name: modu-control-plane
    restart: unless-stopped
    environment:
      PORT: 3000
      HOST: "0.0.0.0"
      CONTROL_PLANE_URL: "http://localhost:3000"
      PROXY_URL: "http://localhost:4000"
      MODU_STORE_PATH: "/data/control-plane-store.json"
    ports:
      - "3000:3000"
    volumes:
      - modu_data:/data

  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    container_name: modu-proxy
    restart: unless-stopped
    environment:
      PORT: 4000
      HOST: "0.0.0.0"
      CONTROL_PLANE_URL: "http://control-plane:3000"
      PROXY_URL: "http://localhost:4000"
      FACILITATOR_URL: "https://facilitator.goplausible.xyz"
      INDEXER_URL: "https://testnet-idx.algonode.cloud"
      CHALLENGE_TIMEOUT_SECONDS: 300
    ports:
      - "4000:4000"
    depends_on:
      - control-plane

  postgres:
    image: postgres:16-alpine
    container_name: modu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: modu
      POSTGRES_PASSWORD: modupassword
      POSTGRES_DB: modu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: modu-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  modu_data:
